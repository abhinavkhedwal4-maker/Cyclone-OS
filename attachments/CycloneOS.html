<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<title>CycloneOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#05070d; --ink:#eef3ff; --dim:#9db0cc;
  --accent:#ffb020; --accent-rgb:255,176,32;   /* JS retints per view */
  --glass:rgba(7,11,22,.46); --edge:rgba(175,205,255,.13); --pulse:0;
  --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--bg) center/cover no-repeat;color:var(--ink);font-family:var(--sans);overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,5,10,.55) 0,transparent 16%,transparent 48%,rgba(3,5,10,.82) 100%)}

.app{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 40%),var(--glass);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--edge);border-radius:16px;box-shadow:0 18px 50px -14px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.07)}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 22px;
  background:rgba(4,7,14,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--edge)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.02em}
.brand i{width:32px;height:32px;border-radius:50%;background:conic-gradient(from 200deg,#ffb020,#3de1a0,#3d9bff,#ffb020);box-shadow:0 0 22px rgba(var(--accent-rgb),.5)}
.brand span{font-weight:400;color:var(--dim)}
.bar .r{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:13px;color:var(--dim)}
select{font:inherit;font-family:var(--mono);color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:10px;padding:9px 12px}

.body{display:grid;grid-template-columns:92px 1fr;min-height:0}
.rail{display:flex;flex-direction:column;gap:6px;padding:16px 8px;background:rgba(4,7,14,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-right:1px solid var(--edge)}
.rail button{all:unset;cursor:pointer;position:relative;text-align:center;padding:12px 0 10px;border-radius:14px;color:var(--dim);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;transition:color .25s,background .25s,transform .2s,box-shadow .3s}
.rail button svg{display:block;margin:0 auto 6px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.rail button:hover{color:var(--ink);transform:translateY(-1px);background:rgba(255,255,255,.05)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail button[aria-current="true"]{color:var(--accent);background:rgba(var(--accent-rgb),.1);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.35),0 0 24px -4px rgba(var(--accent-rgb),.5)}

main{display:grid;grid-template-rows:1fr auto auto;gap:14px;padding:16px 22px 18px;min-height:0;min-width:0}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;min-height:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
h1{margin:10px 0 8px;font-size:clamp(28px,4.3vw,60px);line-height:1.05;font-weight:800;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.7)}
h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 30px rgba(var(--accent-rgb),.45)}
.sub{margin:0;font-family:var(--mono);font-size:14px;color:#c4d2ea;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.watch{flex:none;width:min(440px,38vw);padding:16px}
.dim{color:var(--dim)}
.sl{display:grid;grid-template-columns:82px 1fr 52px;align-items:center;gap:10px;font-size:13px;margin:6px 0}
.sl output{font-family:var(--mono);text-align:right;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.map{width:100%;height:auto;display:block;margin-top:8px;border-radius:10px;background:#050a14}
.map .sea{fill:rgba(61,155,255,.16)} .map .surge{fill:rgba(var(--accent-rgb),.22)}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#4dffb0,var(--accent),#ff5560);transition:width .4s}
.grp{margin-top:10px;font-size:13px}.grp div:first-child{display:flex;justify-content:space-between}
.ctl{display:flex;gap:8px;align-items:center;margin-top:8px}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;font-family:var(--mono);font-size:12px;border:1px solid var(--edge);background:rgba(255,255,255,.06);transition:background .2s}
.btn:hover{background:rgba(var(--accent-rgb),.15)}.btn:focus-visible{outline:2px solid var(--accent)}
.btn.pri{background:rgba(var(--accent-rgb),.2);border-color:rgba(var(--accent-rgb),.6);color:var(--accent)}
.adv{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.35);font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;color:#cfe0ff;max-height:150px;overflow:auto}
.row small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.watch h2{margin:0 0 10px;font-size:14px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;margin-top:6px;border-radius:10px;background:rgba(255,255,255,.045);font-size:13px;transition:background .2s,transform .2s}
.row:hover{background:rgba(var(--accent-rgb),.1);transform:translateX(3px)}
.tag{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.low{color:#4dffb0;background:rgba(77,255,176,.1)}.mid{color:#ffb13d;background:rgba(255,177,61,.12)}.high{color:#ff5560;background:rgba(255,85,96,.15);animation:flick 3s infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:1}47%{opacity:.4}49%{opacity:1}53%{opacity:.6}55%{opacity:1}}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.stat{position:relative;padding:15px 18px;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out,box-shadow .2s,border-color .3s;
  box-shadow:0 18px 50px -14px rgba(0,0,0,.65),0 0 calc(var(--pulse)*34px) rgba(var(--accent-rgb),.55),inset 0 1px 0 rgba(255,255,255,.07)}
.stat:hover{border-color:rgba(var(--accent-rgb),.55)}
.stat::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.1),transparent 60%)}
.stat:hover::after{opacity:1}
.stat p{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stat b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat small{font-size:14px;font-weight:500;color:var(--dim);margin-left:4px}
.stat.crit{border-color:rgba(255,85,96,.5)}
.pop{animation:pop .5s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

.ticker{display:flex;align-items:center;gap:14px;padding:11px 16px;overflow:hidden;font-family:var(--mono);font-size:13px}
.ticker strong{flex:none;color:var(--accent);font-weight:700}
.track{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.track span{display:inline-block;padding-left:100%;animation:scroll 45s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}

@media (max-width:900px){
  .body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{order:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--edge);padding:6px}
  .rail button{padding:8px 6px 6px}
  main{overflow:auto;padding:12px}
  .hero{flex-direction:column;align-items:stretch;padding-top:38vh}.watch{width:auto}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bar .r span{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="scrim"></div>

<div class="app">
  <header class="bar">
    <div class="brand"><i></i>CYCLONEOS</div>
    <div class="r">
      <span>Prototype · sample data</span><select id="loc" aria-label="Region"><option value="ap">Andhra–Odisha coast</option><option value="sb">Sundarbans delta</option><option value="tn">Tamil Nadu coast</option><option value="bd">Bangladesh coast</option></select>
      <span id="clock">--:--:-- UTC</span>
    </div>
  </header>
  <div class="body">
    <nav class="rail" aria-label="Dashboard views">
      <button data-view="overview" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3a9 9 0 019 9M12 21a9 9 0 01-9-9M5 6a9 9 0 0114 0"/></svg>Overview</button>
      <button data-view="surge"><svg viewBox="0 0 24 24"><path d="M2 14c3-4 5 4 8 0s5 4 8 0 3-2 4-1M2 19c3-4 5 4 8 0s5 4 8 0"/></svg>Surge</button>
      <button data-view="rain"><svg viewBox="0 0 24 24"><path d="M7 15a5 5 0 110-10 6 6 0 0111 2 4 4 0 01-1 8zM8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>Rain</button>
      <button data-view="assets"><svg viewBox="0 0 24 24"><path d="M3 21V9l6-4v16M9 21V3l12 6v12M3 21h18"/></svg>Assets</button>
      <button data-view="advisory"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.5"/></svg>Advisory</button>
    </nav>
    <main>
      <section class="hero">
        <div><div class="eyebrow" id="eyebrow">Bay of Bengal — anticipatory action</div>
          <h1 id="h1"></h1><p class="sub" id="sub"></p></div>
        <aside class="glass watch" id="panel"></aside>
      </section>
      <section class="stats" id="stats" aria-live="polite"></section>
      <div class="ticker glass"><strong>IMD Doppler</strong><div class="track"><span id="tick"></span></div></div>
    </main>
  </div>
</div>

/* =====================================================================
   WEBGL: the photo is drawn on a full-screen quad. The fragment shader
   (1) rotates clouds around the funnel with a looping flow-map,
   (2) flashes light at the bolts already in the photo,
   (3) adds rain, colour grade, vignette and film grain.
   ===================================================================== */
const cv = document.getElementById('sky');
const gl = cv.getContext('webgl', {antialias:false, powerPreference:'high-performance'});
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `precision highp float;
uniform sampler2D uTex; uniform vec2 uRes,uMouse; uniform float uAsp,uTime,uPhase,uSwirl,uZoom,uFlash,uRain,uAmt; uniform vec3 uTint; uniform vec3 uL[5];
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 rot(vec2 v,float a){float c=cos(a),s=sin(a);return vec2(c*v.x-s*v.y,s*v.x+c*v.y);}
vec3 tex(vec2 q){return texture2D(uTex,clamp(q,0.001,0.999)).rgb;}
void main(){
  vec2 uv=vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y);
  float sa=uRes.x/uRes.y; vec2 p=uv-.5;
  if(sa>uAsp)p.y*=uAsp/sa; else p.x*=sa/uAsp;          // cover-fit the photo
  p=p/uZoom+.5+uMouse*.012;                            // zoom + mouse parallax
  p.x+=sin(uTime*1.1+p.y*9.)*.0014*smoothstep(.4,.6,p.y)*(1.-smoothstep(.75,.85,p.y)); // funnel sway
  // cloud flow: two rotated samples cross-faded so the loop never shows a seam
  vec2 c=vec2(.53,.42); vec2 A=vec2(uAsp,1.);
  vec2 d=(p-c)*A; float r=length(d);
  float m=(1.-smoothstep(.42,.74,p.y))*smoothstep(.03,.2,r);                       // only the sky
  m*=1.-(1.-smoothstep(.05,.11,abs(p.x-.55)))*smoothstep(.45,.55,p.y);           // keep the funnel itself steady
  float amp=.24*uSwirl*m*exp(-r*1.5);
  float ph1=uPhase,ph2=fract(uPhase+.5),w=1.-abs(2.*uPhase-1.);
  vec3 col=mix(tex(c+rot(d,-ph2*amp)/A),tex(c+rot(d,-ph1*amp)/A),w);
  // lightning glow around the bolts in the photo
  float g=0.; for(int i=0;i<5;i++){vec2 e=(p-uL[i].xy)*A; g+=exp(-dot(e,e)*34.)*uL[i].z;}
  float lum=dot(col,vec3(.3,.59,.11));
  col+=vec3(.62,.78,1.)*g*(.22+lum*1.7);
  col+=vec3(.5,.65,1.)*uFlash*(.04+lum*.55)*(1.15-p.y*.6);
  // rain streaks (screen space)
  vec2 q=vec2(uv.x*sa*46.+uv.y*7.,uv.y*2.4-uTime*2.6); vec2 f=fract(q),id=floor(q);
  float st=step(.9,h(id))*smoothstep(.42,.5,f.x)*smoothstep(.58,.5,f.x)*smoothstep(0.,.5,f.y)*(1.-f.y);
  col+=vec3(.7,.8,1.)*st*.16*uRain;
  col=mix(col,col*uTint*1.5,uAmt);                     // colour grade per view
  col*=1.-.5*pow(length(uv-.5)*1.3,2.2);               // vignette
  col+=(h(uv*uRes+uTime)-.5)*.035;                     // film grain
  gl_FragColor=vec4(col,1.);
}`;
let U = {}, glOK = !!gl, aspect = 1.79;
if (glOK) {
  const sh = (t,s) => { const o = gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(pr); glOK = gl.getProgramParameter(pr, gl.LINK_STATUS);
  if (glOK) {
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    ['uTex','uRes','uMouse','uAsp','uTime','uPhase','uSwirl','uZoom','uFlash','uRain','uAmt','uTint','uL'].forEach(n => U[n] = gl.getUniformLocation(pr, n));
  }
}
const photo = new Image(); let ready = false;
photo.onload = () => {
  aspect = photo.width / photo.height;
  if (!glOK) return;
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,photo);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  ready = true;
};
photo.src = IMG;
if (!glOK) { cv.style.display = 'none'; document.body.style.backgroundImage = `url(${IMG})`; }  // fallback: still photo

/* Storm state eases toward the active view's target */

let target = VIEWS.overview;
const mouse = {x:0,y:0,sx:0,sy:0};
addEventListener('pointermove', e => { mouse.x = e.clientX/innerWidth-.5; mouse.y = e.clientY/innerHeight-.5; });

/* Lightning: five light spots placed on the bolts in the photo (image UV, top-down) */
const LIGHTS = [[.46,.58],[.63,.63],[.90,.50],[.10,.47],[.53,.46]];
const lp = new Float32Array(15); LIGHTS.forEach((l,i) => { lp[i*3] = l[0]; lp[i*3+1] = l[1]; });
let flash = 0, nextStrike = 3, phase = 0;
const root = document.documentElement.style;
function strike(power = 1){
  power *= CONFIG.flashPower;
  const n = 1 + Math.floor(Math.random()*3), set = () => {
    for (let k = 0; k < n; k++) lp[((Math.random()*5)|0)*3+2] = power * (.7 + Math.random()*.5);
    lp[14] = Math.max(lp[14], power*.8); flash = Math.max(flash, power*.5);
  };
  set(); setTimeout(set, 90 + Math.random()*80);                       // quick double flicker
  root.setProperty('--pulse', 1); setTimeout(() => root.setProperty('--pulse', 0), 180);
}

function resize(){
  const dpr = Math.min(devicePixelRatio, CONFIG.maxPixelRatio);
  cv.width = innerWidth*dpr|0; cv.height = innerHeight*dpr|0;
  if (glOK) gl.viewport(0,0,cv.width,cv.height);
}
let last = performance.now(), running = true;
function frame(now){
  if (!running) return; requestAnimationFrame(frame);
  const dt = Math.min((now-last)/1000, .05); last = now;
  const k = 1-Math.exp(-2*dt), T = target;
  cur.swirl += (T.swirl-cur.swirl)*k; cur.speed += (T.speed-cur.speed)*k; cur.zoom += (T.zoom-cur.zoom)*k;
  cur.rain += (T.rain-cur.rain)*k; cur.amt += (T.amt-cur.amt)*k; cur.sev += (T.sev-cur.sev)*k;
  for (let i = 0; i < 3; i++) cur.tint[i] += (T.tint[i]-cur.tint[i])*k;
  mouse.sx += (mouse.x-mouse.sx)*k; mouse.sy += (mouse.y-mouse.sy)*k;
  phase = (phase + dt*cur.speed*CONFIG.cloudSpeed*(reduced?.25:1)/18) % 1;   // 18 s per cloud loop
  if (!reduced) { nextStrike -= dt;
    if (nextStrike <= 0) { strike(.55 + cur.sev*.15);
      const g = CONFIG.lightningGap; nextStrike = (g[0]+Math.random()*(g[1]-g[0])) / (1 + (cur.sev-1)*.9); } }
  const dec = Math.exp(-dt*7); for (let i = 0; i < 5; i++) lp[i*3+2] *= dec; flash *= Math.exp(-dt*6);
  if (!ready) return;
  gl.uniform1i(U.uTex,0); gl.uniform2f(U.uRes,cv.width,cv.height); gl.uniform2f(U.uMouse,mouse.sx,mouse.sy);
  gl.uniform1f(U.uAsp,aspect); gl.uniform1f(U.uTime,now/1000); gl.uniform1f(U.uPhase,phase);
  gl.uniform1f(U.uSwirl,cur.swirl*CONFIG.cloudSwirl); gl.uniform1f(U.uZoom,cur.zoom*(1+Math.sin(now/6000)*.008));
  gl.uniform1f(U.uFlash,flash); gl.uniform1f(U.uRain,cur.rain*CONFIG.rain); gl.uniform1f(U.uAmt,cur.amt);
  gl.uniform3fv(U.uTint,cur.tint); gl.uniform3fv(U.uL,lp);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(frame); } });
addEventListener('resize', resize); resize(); requestAnimationFrame(frame);

/* =====================================================================
   DASHBOARD UI
   ===================================================================== */
const $ = id => document.getElementById(id);
let curView = 'overview';
const tagOf = {low:'LOW',mid:'ELEVATED',high:'CRITICAL'};
const rowsHTML = r => r.map(x => `<div class="row pop"><div><b>${x[0]}</b>${x[2]?`<small>${x[2]}</small>`:''}</div><span class="tag ${x[3]}">${x[1]}</span></div>`).join('');

function mapSVG(){                                                        // coast map: dots turn amber when below the water line
  const dots = ASSETS.map(a => { const f = a.e < lvl(), c = f ? 'var(--accent)' : '#7fe8c0';
    const sh = a.t==='p' ? `<rect x="-1.4" y="-1.4" width="2.8" height="2.8" fill="${c}"/>` : a.t==='m' ? `<path d="M-.7-2h1.4v1.3h1.3v1.4h-1.3v1.3h-1.4v-1.3h-1.3v-1.4h1.3z" fill="${c}"/>` : `<circle r="1.5" fill="${c}"/>`;
    return `<g transform="translate(${a.x} ${a.y})" opacity="${f?1:.75}"><title>${a.n}: ground ${a.e} m</title>${sh}${f?'<circle r="3.2" fill="none" stroke="var(--accent)" stroke-width=".4"/>':''}</g>`; }).join('');
  const reach = Math.min(30, lvl()*4.2);                                   // surge band pushes inland with water level
  return `<svg class="map" viewBox="0 0 100 60" role="img" aria-label="Coastal exposure map"><path class="surge" d="M${64-reach} 0C${60-reach} 14 ${68-reach} 24 ${62-reach} 36S${66-reach} 50 ${60-reach} 60L64 60C60 50 66 36 62 36S68 14 64 0z"/><path class="sea" d="M64 0C60 14 68 24 62 36S66 50 60 60H100V0z"/><path d="M64 0C60 14 68 24 62 36S66 50 60 60" fill="none" stroke="rgba(150,200,255,.5)" stroke-width=".4"/>${dots}</svg>`;
}
function genAdvisory(){
  const act = {municipal:'open relief shelters, pre-position pumps in low-lying wards, begin evacuation of the surge band.',
    health:'move patients off ground floors, confirm backup power and stock at '+flooded('m')+' exposed medical sites.',
    grid:'isolate '+flooded('p')+' substations below the water line and stage repair crews inland.'}[sim.aud];
  const who = {municipal:'Municipal commissioner',health:'Health department',grid:'Power utility'}[sim.aud];
  return `TO: ${who}\nREGION: ${REG[sim.region].n}\nFORECAST: water level ${lvl().toFixed(1)} m, about ${Math.round(pop()/1000)}k people and ${flooded()} of ${total()} critical assets below the surge line.\nACTION: ${act}\nNEXT UPDATE: 30 min`;
  /* To use Gemini instead: POST this summary to YOUR backend, which calls Gemini and returns the text. Never put an API key in this page. */
}
const PANELS = {
 overview:()=>`<h2>Risk drivers and data feeds</h2><div class="bar"><i style="width:82%"></i></div>${rowsHTML([
   ['Sentinel-1 flood mask','LIVE','Google Earth Engine · 06:12 UTC','low'],['GPM IMERG rainfall','LIVE','Google Earth Engine · 30 min','low'],
   ['IMD wind and track','LIVE','Meteorological feed · 3 h','low'],['Gemini 3.7 Flash','READY','Multimodal advisory reasoning','mid']])}`,
 surge:()=>`<h2>Surge simulator</h2><label class="sl">Storm surge<input type="range" id="sg" min=".5" max="6" step=".1" value="${sim.surge}"><output id="sgo">${sim.surge.toFixed(1)} m</output></label>
   <label class="sl">Tide<input type="range" id="td" min="0" max="1.5" step=".1" value="${sim.tide}"><output id="tdo">${sim.tide.toFixed(1)} m</output></label><div id="mapbox">${mapSVG()}</div>`,
 rain:()=>`<h2>Damage pathways</h2>${rowsHTML([
   ['Godavari catchment','CRITICAL','River overflow → NH-16 cut → substation B offline','high'],['Krishna delta','ELEVATED','Canal breach → paddy loss → income shock','mid'],
   ['Coastal urban wards','ELEVATED','Drain backflow → 3 shelters cut off','mid']])}`,
 assets:()=>`<h2>Exposure below the water line</h2>${[['Power grid','p'],['Arterial roads','r'],['Medical shelters','m']].map(g => { const f=flooded(g[1]), n=total(g[1]);
   const names = ASSETS.filter(a => a.t===g[1] && a.e<lvl()).slice(0,2).map(a => a.n).join(', ') || 'None below the line';
   return `<div class="grp"><div><b>${g[0]}</b><span>${f}/${n}</span></div><div class="bar"><i style="width:${f/n*100}%"></i></div><small class="dim">${names}</small></div>`; }).join('')}`,
 advisory:()=>`<h2>Advisory dispatch</h2><div class="ctl"><select id="aud"><option value="municipal">Municipal commissioner</option><option value="health">Health department</option><option value="grid">Power utility</option></select><button class="btn" id="gen">Generate</button></div>
   <pre class="adv" id="advtxt">${genAdvisory()}</pre><div class="ctl"><button class="btn pri" id="send">Dispatch</button><span class="dim" id="log" style="font-size:12px"></span></div>`
};
function refresh(){                                                       // live numbers only; keeps sliders draggable
  document.querySelectorAll('.stat b').forEach((el,i) => { const s = STATS[curView]()[i]; el.innerHTML = `${s[1]}<small>${s[2]}</small>`; });
  if ($('mapbox')) $('mapbox').innerHTML = mapSVG();
  if (curView === 'assets') $('panel').innerHTML = PANELS.assets();
}
function render(view){
  curView = view; const v = VIEWS[view], h = HERO[view];
  root.setProperty('--accent-rgb', v.rgb); root.setProperty('--accent', `rgb(${v.rgb})`);
  $('h1').innerHTML = `${h[0]}<span style="color:var(--dim)"> / </span><em>${h[1]}</em>`;
  $('sub').textContent = `${h[2]} · ${REG[sim.region].n}`;
  $('eyebrow').textContent = v.sev === 3 ? 'Severe — dispatch window open' : 'Bay of Bengal — anticipatory action';
  $('panel').innerHTML = PANELS[view]();
  $('stats').innerHTML = STATS[view]().map((s,i) => `<article class="stat glass pop" style="animation-delay:${i*45}ms"><p>${s[0]}</p><b>${s[1]}<small>${s[2]}</small></b></article>`).join('');
  if (view === 'surge') {
    $('sg').oninput = e => { sim.surge = +e.target.value; $('sgo').textContent = sim.surge.toFixed(1)+' m'; refresh(); };
    $('td').oninput = e => { sim.tide = +e.target.value; $('tdo').textContent = sim.tide.toFixed(1)+' m'; refresh(); };
  }
  if (view === 'advisory') {
    $('aud').value = sim.aud; $('aud').onchange = e => { sim.aud = e.target.value; $('advtxt').textContent = genAdvisory(); };
    $('gen').onclick = () => { $('advtxt').textContent = genAdvisory(); };
    $('send').onclick = () => { sim.sent++; $('log').textContent = 'Sent '+new Date().toISOString().slice(11,16)+' UTC'; refresh(); strike(.8); };
  }
}
document.querySelector('.rail').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if (!b) return;
  document.querySelectorAll('.rail button').forEach(x => x.removeAttribute('aria-current'));
  b.setAttribute('aria-current','true');
  target = VIEWS[b.dataset.view]; render(b.dataset.view);
  strike(.7 + target.sev*.15); if (target.sev === 3) setTimeout(() => strike(1.1), 220);   // flash on every switch
});
$('loc').addEventListener('change', e => { sim.region = e.target.value; render(curView); strike(.8); });
$('stats').addEventListener('pointermove', e => {                       // card tilt + glimmer
  const c = e.target.closest('.stat'); if (!c) return;
  const r = c.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
  c.style.setProperty('--ry',((x-.5)*8).toFixed(1)+'deg'); c.style.setProperty('--rx',((.5-y)*6).toFixed(1)+'deg');
  c.style.setProperty('--mx',x*100+'%'); c.style.setProperty('--my',y*100+'%');
});
$('stats').addEventListener('pointerout', e => { const c = e.target.closest('.stat'); if (c){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');} });
setInterval(() => { $('clock').textContent = new Date().toISOString().slice(11,19)+' UTC'; }, 1000);
$('tick').textContent = TICK + TICK;
render('overview');
</script>
